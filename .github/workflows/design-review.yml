name: Design review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to review
        required: true
        type: number

permissions:
  contents: read

jobs:
  review:
    name: design-review
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft
      )
    runs-on: ${{ vars.CERT_RUNNER }}
    timeout-minutes: 120
    concurrency:
      group: design-review-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shots_url: ${{ steps.shots.outputs.artifact-url }}
    env:
      LEFTHOOK: '0'
      NODE_OPTIONS: --max-old-space-size=8192
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: The pull request's head and base
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: Number(process.env.PR_NUMBER) });
            if (pr.head.repo?.full_name !== `${owner}/${repo}`) core.setFailed(`#${pr.number} comes from a fork`);
            core.setOutput('head', pr.head.sha);
            core.setOutput('base', pr.base.sha);

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.pr.outputs.base }}
          path: .base
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Build main and the pull request
        run: |
          (cd .base && npm ci --no-audit --no-fund && npm run build)
          npm ci --no-audit --no-fund && npm run build

      - name: The Spectrum site's pages, from its sitemap
        run: |
          mkdir -p "$RUNNER_TEMP/review/shots"
          curl -fsSL https://spectrum.adobe.com/sitemap.xml | grep -oE '<loc>[^<]+</loc>' | sed -E 's|</?loc>||g' > "$RUNNER_TEMP/review/spectrum-urls.txt"
          wc -l < "$RUNNER_TEMP/review/spectrum-urls.txt"

      - name: Two Chromes with windows, main on CDP 9301 and the pull request on CDP 9302
        run: |
          chrome=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -z "$chrome" ]; then
            chrome=$(node -e "console.log(require('playwright-core').chromium.executablePath())")
          fi
          headless=
          if [ -z "${DISPLAY:-}" ]; then
            if command -v Xvfb > /dev/null; then
              nohup Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
              export DISPLAY=:99
              echo "DISPLAY=:99" >> "$GITHUB_ENV"
              sleep 2
            else
              echo "::warning::no display and no Xvfb on $RUNNER_NAME; headless Chrome reports no hover"
              headless=--headless=new
            fi
          fi
          echo "chrome: $chrome ($("$chrome" --version)), display: ${DISPLAY:-none}"
          for tree in .base:9301:8301 .:9302:8302; do
            IFS=: read -r dir cdp port <<< "$tree"
            (cd "$dir" && PORT=$port nohup node test/integration/chrome.mjs > "$RUNNER_TEMP/serve-$port.log" 2>&1 &)
          done
          for port in 8301 8302; do
            for _ in $(seq 60); do curl -fs "http://127.0.0.1:$port/ui/" > /dev/null && break; sleep 1; done
          done
          for tree in base:9301:8301 head:9302:8302; do
            IFS=: read -r name cdp port <<< "$tree"
            nohup "$chrome" $headless --no-sandbox --no-first-run --no-default-browser-check \
              --remote-debugging-port="$cdp" --user-data-dir="$RUNNER_TEMP/chrome-$name" --window-size=1440,900 \
              "http://127.0.0.1:$port/ui/?delay=0&color=light" > "$RUNNER_TEMP/chrome-$name.log" 2>&1 &
          done
          for cdp in 9301 9302; do
            for _ in $(seq 30); do curl -fs "http://127.0.0.1:$cdp/json/version" > /dev/null && break; sleep 1; done
            curl -fsS "http://127.0.0.1:$cdp/json/version"
          done

      - name: Review
        id: review
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ vars.CERT_AWS_REGION || 'us-west-2' }}
          GH_TOKEN: ${{ github.token }}
        with:
          use_bedrock: 'true'
          github_token: ${{ github.token }}
          allowed_bots: 'renovate[bot]'
          show_full_output: ${{ github.event_name == 'workflow_dispatch' }}
          claude_args: |
            --model ${{ vars.CERT_BEDROCK_MODEL || 'global.anthropic.claude-opus-5-5' }}
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch"
            --permission-mode bypassPermissions
            --max-turns 300
          prompt: |
            You are the design reviewer for slicc-spectrum: SLICC's terminal and app shell as web components on Spectrum 2 (Spectrum Web Components Gen2, `--swc-*` tokens, Spectrum 2 workflow icons). Review pull request ${{ env.PR_NUMBER }} of ${{ github.repository }} visually, against Spectrum 2 and general design guidelines. Run: ${{ env.RUN_URL }}.

            WHAT'S SET UP
            - The current directory is the pull request (${{ steps.pr.outputs.head }}) and `.base/` is main (${{ steps.pr.outputs.base }}), each built (`dist/`). `git diff ${{ steps.pr.outputs.base }}...HEAD` is the change. Read `README.md` (one row per component) and `AGENTS.md` first: they are the design notes.
            - Two Chromes with windows (Xvfb, so hover works) run the UI test page against the dummy model: **main** on CDP `http://127.0.0.1:9301`, page `http://127.0.0.1:8301/ui/?delay=0&color=light`, and **the pull request** on CDP `http://127.0.0.1:9302`, page `http://127.0.0.1:8302/ui/?delay=0&color=light`. Other pages on the same servers: `/` (the terminal) and `/kernel-ui/`. Drive them with `playwright-core` (in both `node_modules`; `chromium.connectOverCDP`) from small Node scripts.
            - Query parameters: `delay=0` (keep it; the dummy paces replies with timers otherwise), `color=light|dark|system`, `readonly=version`, `leaders=two|failed|unlinked|disconnected`, and the follow/watch-only scenarios in the README's dummy section. Pick a cone by clicking its row in the Agents panel (`[data-id="cone-kitchen-sink"]`): kitchen-sink is the tour (every message kind, tool runs, licks, decisions, error cards, dividers), harbor has scoops, release-notes has severity licks, and inbox-triage and release-notes have unread counts.
            - Spectrum's guidelines: `${{ runner.temp }}/review/spectrum-urls.txt` lists every page of spectrum.adobe.com (foundations, components, content). Fetch the ones that apply with WebFetch, or open them in a Chrome to see their examples.

            HOW TO SHOOT (what goes wrong otherwise)
            - Before every screenshot: wait for `customElements.whenDefined('slicc-app')` and `document.fonts.ready` (Adobe Clean loads late; a fallback font means the shot was too early), blur focus (`document.activeElement?.blur()`), and wait about 400 ms for transitions.
            - Compare main and the pull request in the same state and at the same anchor: scroll the same `data-id` into view (the chat pins to the bottom, so a raw diff is often only a scroll offset).
            - Phone: a real 420×860 viewport with `Emulation.setDeviceMetricsOverride` and `mobile: true`, not a narrowed desktop window. Desktop 1440×900; tablet under 1200 px wide.
            - The sandboxed sprinkle iframe stops painting off screen: scroll a dip into view and wait for its height to settle before you judge it.
            - Shoot both light and dark. Shoot `prefers-reduced-motion`, `prefers-reduced-transparency` and forced colors when the change touches motion, the frosted composer or borders.
            - Also catch what a still shot misses: hover-only strips and focus-within reveals, streaming states (pulsing tool icons, the composer's and transcript's streaming icons), permission countdowns, the sticky decision pile after scrolling, and collapsed vs expanded (cones, lick bodies, tool cards).
            - Not bugs: fixture text is invented, and times are relative to page load. RTL: check logical properties (`margin-inline`, `inset-inline`) in the CSS diff rather than shooting `dir=rtl`, unless the change touches layout direction. Spectrum's large scale isn't used.

            WHAT TO CHECK (start with what the change touches, then look around it for regressions)
            1. **Tokens only:** `--swc-*` for colour, spacing, radius, type size and weight, and shadow. Flag raw px, hex or `rgb()` in CSS diffs; the decision pile's depth scale and blur are the known exceptions.
            2. **Never colour alone** for status or severity: every status light has its word, every error card its icon and "Error:", every severity lick its icon, and the word survives truncation at 420.
            3. **Contrast** AA (4.5:1 text, 3:1 icons and boundaries), especially text on tints (the indigo bubble, the unread pill, notice and negative fills) in dark.
            4. **Focus:** a visible ring on every interactive element, nothing hidden under the floating composer or the sticky pile, and no hover-only actions.
            5. **Copy:** sentence case, no em dashes, no uppercase labels, no "Click here", labels that match their actions; the negative variant only for destructive, unrecoverable actions, with Cancel focused.
            6. **Typography:** Adobe Clean Spectrum VF with token weights (bold titles, subdued detail colour).
            7. **Icons:** Spectrum workflow icons (`swc-icon-*`, `sp-icon-*`) at consistent sizes per surface; emoji only where designed, with `aria-hidden`.
            8. **Layout:** no horizontal overflow at 420, headers that ellipsize instead of wrapping, and nothing that moves between main and the pull request unless the change means it to.
            9. **Hooks and imports:** no renamed `data-id`, `data-action`, `data-surface` or `slot="status"` (slicc-bios tests on them); Spectrum components imported one by one; no React.
            Surfaces to cover as the change warrants: the chat transcript (kitchen-sink at top, middle and bottom), the composer (empty, a 3-line draft, attachments, queued rows), Agents, Changes and the diff, Network (`?leaders=two`), Settings, Monitor, Files and Memory, the Browser panel, the Freezer, the approvals dialog, notices, and the follow page and watch-only footer.

            YOUR ANSWER
            Write the review to `${{ runner.temp }}/review/comment.md` and put its screenshots in `${{ runner.temp }}/review/shots/` as PNG (at most 30, cropped to what matters). Reference each one from the comment as `![main, dark, composer](shots/composer-dark-main.png)`, with file names of letters, digits, dots, dashes and underscores only; a later step uploads them and inlines them in the comment. Shoot main and the pull request in pairs where they differ. Start with a one-line verdict (looks good / minor issues / needs changes), then the findings, each with its severity, the screenshot, the Spectrum page it rests on, and a concrete fix. End with what you checked and anything about this setup that got in your way. Don't edit, commit or push anything, approve or request changes, or comment on the pull request yourself.

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: shots
        if: always() && steps.review.outcome != 'skipped'
        with:
          name: design-review-shots-${{ env.PR_NUMBER }}
          path: ${{ runner.temp }}/review/shots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.review.outcome != 'skipped'
        with:
          name: design-review-comment-${{ env.PR_NUMBER }}
          path: ${{ runner.temp }}/review/comment.md
          if-no-files-found: ignore

      - name: Evidence
        if: always()
        env:
          EXECUTION: ${{ steps.review.outputs.execution_file }}
        run: |
          mkdir -p "$RUNNER_TEMP/review"
          cp "${EXECUTION:-$RUNNER_TEMP/claude-execution-output.json}" "$RUNNER_TEMP/review/claude-turns.json" 2>/dev/null || true
          cp "$RUNNER_TEMP"/*.log "$RUNNER_TEMP/review/" 2>/dev/null || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: design-review-${{ github.event.pull_request.number || inputs.pr_number }}
          path: ${{ runner.temp }}/review/
          if-no-files-found: ignore

  post:
    name: design-review / post
    needs: review
    if: always() && needs.review.result != 'skipped' && needs.review.result != 'cancelled'
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHOTS_URL: ${{ needs.review.outputs.shots_url }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '155ec15a52a18a14801e04b019da5e5a' }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'slicc-pr-screenshots' }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || 'https://pub-e4170b327f03406f9831a6f393b96e05.r2.dev' }}
      # renovate: datasource=npm depName=wrangler
      WRANGLER_VERSION: 4.151.0
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          name: design-review-shots-${{ env.PR_NUMBER }}
          path: ${{ runner.temp }}/review/shots

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          name: design-review-comment-${{ env.PR_NUMBER }}
          path: ${{ runner.temp }}/review

      - name: Screenshots to R2
        id: r2
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          prefix="slicc-spectrum/pr-$PR_NUMBER/$GITHUB_RUN_ID"
          : > "$RUNNER_TEMP/review/uploaded.txt"
          for f in "$RUNNER_TEMP"/review/shots/*.png; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            if ! [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::warning::$name has characters R2 keys here don't allow; it stays in the artifact"
              continue
            fi
            npx --yes "wrangler@$WRANGLER_VERSION" r2 object put "$R2_BUCKET/$prefix/$name" \
              --file "$f" --content-type image/png --remote
            echo "$name" >> "$RUNNER_TEMP/review/uploaded.txt"
          done
          echo "base=$R2_PUBLIC_BASE_URL/$prefix" >> "$GITHUB_OUTPUT"

      - name: Comment, with the screenshots inline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          REVIEW: ${{ runner.temp }}/review
          R2_BASE: ${{ steps.r2.outputs.base }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const read = (name) => (fs.existsSync(path.join(process.env.REVIEW, name)) ? fs.readFileSync(path.join(process.env.REVIEW, name), 'utf8') : '');
            let body = read('comment.md').trim();
            if (!body) body = `**Design review:** the reviewer wrote no comment. See ${process.env.RUN_URL}`;
            const uploaded = new Set(read('uploaded.txt').split('\n').filter(Boolean));
            const base = process.env.R2_BASE;
            const shots = process.env.SHOTS_URL;
            body = body.replace(/!\[([^\]]*)\]\((?:\.\/)?shots\/([^)\s]+)\)/g, (_, alt, name) => {
              if (base && uploaded.has(name)) return `![${alt || name}](${base}/${name})`;
              return shots ? `📷 _${alt || name}_ ([\`${name}\`](${shots}))` : `📷 _${alt || name}_ (\`${name}\`)`;
            });
            const footer = shots
              ? `<sub>Screenshots: [design-review-shots-${process.env.PR_NUMBER}](${shots}) · [run](${process.env.RUN_URL})</sub>`
              : `<sub>[run](${process.env.RUN_URL})</sub>`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `${body}\n\n${footer}\n`,
            });
